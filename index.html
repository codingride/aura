<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Language Web Runtime</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: #161b22;
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid #30363d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #58a6ff;
      margin-bottom: 0.5rem;
    }

    p {
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .output-box {
      background: #0d1117;
      border: 1px solid #30363d;
      padding: 1rem;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      border-radius: 6px;
      color: #7ee787;
      font-size: 1.2rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🌌 Aura Web Assembly Engine</h1>
    <p>Loading compiled bytecode execution pathways...</p>
    <div class="output-box" id="wasm-output">Initializing runtime...</div>
  </div>

  <script>
    const outputElement = document.getElementById('wasm-output');

    // 1. Point to the WebAssembly bytecode file generated by your compiler
    const wasmModulePath = './aura_module.wasm';

    async function loadAuraRuntime() {
      try {
        // 2. Stream and instantiate the raw bytecode file into the browser memory engine
        const response = await fetch(wasmModulePath);
        const bytes = await response.arrayBuffer();
        const { instance } = await WebAssembly.instantiate(bytes, {});

        console.log("Aura WebAssembly Instance Loaded Successfully:", instance.exports);

        // 3. Check if your custom 'add' function exists in the compiled exports array
        if (instance.exports.add) {
          // Execute your compiled function directly inside the browser at bare-metal speeds!
          const result = instance.exports.add(20, 22);
          outputElement.innerText = `Result of add(20, 22) = ${result}`;
        } else {
          outputElement.style.color = '#ff7b72';
          outputElement.innerText = "Execution Error: Function 'add' not exported. Make sure it is defined in your .au file.";
        }

      } catch (error) {
        console.error("Wasm Loading Error:", error);
        outputElement.style.color = '#ff7b72';
        outputElement.innerText = `Failed to load Wasm runtime module. Ensure you are running a local web server! Detail: ${error.message}`;
      }
    }

    loadAuraRuntime();
  </script>
</body>

</html>
